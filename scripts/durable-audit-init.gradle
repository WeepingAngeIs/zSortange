gradle.projectsEvaluated {
    def p = gradle.rootProject
    p.tasks.register('durableAuditClasspath') {
        dependsOn p.tasks.named('createMinecraftArtifacts')
        doLast {
            def out=p.file('build/durable-audit');out.mkdirs()
            new File(out,'classpath.txt').text=p.sourceSets.main.compileClasspath.asPath
        }
    }
}
