// Test-only binaries. No fixture class, dependency or launch action is shipped in the playable JAR.
sourceSets { acceptance; packagedLauncher }
neoForge.addModdingDependenciesTo(sourceSets.acceptance)
neoForge.addModdingDependenciesTo(sourceSets.packagedLauncher)
repositories {
    maven { url = 'https://chocolateminecraft.com/maven'; content { includeGroup 'xaero.pac' } }
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'tschipp.carryon' } }
}
tasks.register('acceptanceJar', Jar) {
    dependsOn tasks.named('acceptanceClasses')
    from sourceSets.acceptance.output
    archiveBaseName = 'anya-storage-acceptance-fixture'
    destinationDirectory = layout.buildDirectory.dir('acceptance')
}
dependencies {
    acceptanceCompileOnly sourceSets.main.output
    acceptanceCompileOnly 'xaero.pac:open-parties-and-claims-neoforge-1.21.1:0.33.0'
    acceptanceCompileOnly 'tschipp.carryon:carryon-neoforge-1.21.1:2.2.6.13'
    packagedLauncherRuntimeOnly files(tasks.named('jar'))
    packagedLauncherRuntimeOnly files(tasks.named('acceptanceJar'))
    packagedLauncherRuntimeOnly 'xaero.pac:open-parties-and-claims-neoforge-1.21.1:0.33.0'
    packagedLauncherRuntimeOnly 'tschipp.carryon:carryon-neoforge-1.21.1:2.2.6.13'
}
tasks.register('stageAcceptanceDependencies', Copy) {
    dependsOn 'jar', 'acceptanceJar'
    from configurations.packagedLauncherRuntimeClasspath.filter { it.name.contains('open-parties-and-claims-') || it.name.startsWith('carryon-') }
    into layout.buildDirectory.dir('acceptance/dependencies')
}
neoForge.runs {
    acceptanceClient {
        client()
        sourceSet = sourceSets.packagedLauncher
        loadedMods = []
        gameDirectory = project.file('run-packaged-client-' + (project.findProperty('role') ?: 'Alpha'))
        systemProperty 'anya.acceptance', 'true'
        systemProperty 'anya.role', project.findProperty('role') ?: 'Alpha'
        systemProperty 'anya.control', project.file('build/acceptance/control').absolutePath
        systemProperty 'anya.expectedJar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
        programArguments.addAll '--username', 'AnyaQA' + (project.findProperty('role') ?: 'Alpha'), '--width', '960', '--height', '640'
        jvmArguments.addAll '-Xmx1000m', '-Xms256m'
    }
}

tasks.named('runAcceptanceClient', JavaExec) {
    dependsOn 'jar', 'acceptanceJar'
    doFirst {
        if(project.hasProperty('exportAcceptanceLaunch')) {
            def role = project.findProperty('role') ?: 'Alpha'
            def target = project.file("build/acceptance/client-${role}.json")
            target.parentFile.mkdirs()
            def launch = new ArrayList(commandLine)
            launch[0] = javaLauncher.get().executablePath.asFile.absolutePath
            assert launch.every { it != null }
            target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([command: launch, cwd: workingDir.absolutePath]))
            throw new StopExecutionException('Exported packaged client command without launching')
        }
    }
}
