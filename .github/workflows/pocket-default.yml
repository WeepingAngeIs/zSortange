name: Skygrid default-on and saved opt-out check
on:
  push:
    branches: [experiment/pocket-default]
permissions: {contents: read}
jobs:
  guide:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env: {VERIFY_POCKET_DEFAULT: 'true', LIBGL_ALWAYS_SOFTWARE: '1', ALSOFT_DRIVERS: 'null', LP_NUM_THREADS: '2'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - run: |
          gradle --no-daemon --max-workers=2 jar
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
          gradle --no-daemon --max-workers=2 -I fixtures/camera-roles/fixture.gradle -ProleTrial=sharp-horizon-solo -ProlePlayable="$PWD/build/libs/anya-storage-plus-0.3.0-beta.7-pocketdefault.1.jar" prepareRoleTrial
          python3 -Bu fixtures/camera-roles/run.py sharp-horizon-solo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-default-evidence
          path: |
            build/role-check/sharp-horizon-solo/control/
            build/role-check/sharp-horizon-solo/CamOwner/console.log
      - uses: actions/upload-artifact@v4
        with: {name: pocket-default-candidate, path: build/libs/anya-storage-plus-0.3.0-beta.7-pocketdefault.1.jar}
