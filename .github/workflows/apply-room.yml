name: Apply reviewed current-pose raycast correction
on:
  push:
    branches: [feature/elemental-pockets]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact guarded changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,subprocess
          src=Path('scripts/reviewed-raycast.b64')
          if src.exists():
              raw=lzma.decompress(base64.b64decode(src.read_text(),validate=True))
              assert hashlib.sha256(raw).hexdigest()=='58576f16549810791805d4b336587ad150e10e70e81a374036d477ca3f4f7649'
              data=json.loads(raw);expected=data['preconditions'];patch=data['patch'].encode()
              for name,digest in expected.items():
                  assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest, 'Refusing changed source: '+name
              subprocess.run(['git','apply','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','-'],input=patch,check=True)
              src.unlink()
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','add','--',*expected.keys(),str(src)],check=True)
              subprocess.run(['git','commit','-m','Use current server pose for edits and assert exact targets, world conservation and cooldown'],check=True)
              subprocess.run(['git','push','origin','HEAD:refs/heads/feature/elemental-pockets'],check=True)
          PY
