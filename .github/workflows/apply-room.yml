name: Add synchronized one-shot deposit evidence
on:
  push:
    branches: [feature/elemental-pockets]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact fixture changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,subprocess
          src=Path('scripts/reviewed-room-deposit.b64')
          if src.exists():
              raw=lzma.decompress(base64.b64decode(src.read_text(),validate=True))
              assert hashlib.sha256(raw).hexdigest()=='bd0fd58c853e8b4c49ef62b0213fc10afcd249d1c781de531c2c747f6ca27157'
              data=json.loads(raw);expected=data['preconditions'];patch=data['patch'].encode()
              for name,digest in expected.items():
                  assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest, 'Refusing changed source: '+name
              subprocess.run(['git','apply','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','-'],input=patch,check=True)
              src.unlink()
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','add','--',*expected.keys(),str(src)],check=True)
              subprocess.run(['git','commit','-m','Issue one room deposit on a fresh snapshot and record client/server revision and conservation'],check=True)
              subprocess.run(['git','push','origin','HEAD:refs/heads/feature/elemental-pockets'],check=True)
          PY
