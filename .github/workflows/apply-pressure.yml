name: Apply reviewed pressure experiment
on:
  push:
    branches: [feature/elemental-pockets]
    paths: ['scripts/reviewed-pressure.*.b64', '.github/workflows/apply-pressure.yml']
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact new isolated test files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,json,subprocess
          parts=[Path(f'scripts/reviewed-pressure.{i}.b64') for i in range(2)]
          raw=lzma.decompress(base64.b64decode(''.join(p.read_text() for p in parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='e913ed6dca25b3906bd5e5418d619cefa6d512fed98be0a11fc9a0a4a1ebafe0'
          files=json.loads(raw)
          for name,text in files.items():
              p=Path(name)
              assert not p.is_absolute() and '..' not in p.parts and name.startswith(('src/pressureProbe/','src/pressureTest/','scripts/pressure'))
              assert not p.exists(), 'Refusing to overwrite newer file: '+name
          for name,text in files.items():
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          for p in parts:p.unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*files.keys(),*[str(p) for p in parts]],check=True)
          subprocess.run(['git','commit','-m','Add bounded admission backpressure and sustained dirty-receipt fixtures'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/feature/elemental-pockets'],check=True)
          PY
