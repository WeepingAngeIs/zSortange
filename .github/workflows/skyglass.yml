name: Skyglass outdoor camera prototype
on:
  push:
    branches: [experiment/skyglass]

permissions:
  actions: read
  contents: read

jobs:
  skygrid:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      BASELINE: anya-storage-plus-0.3.0-beta.7-roombuild.1.jar
      PLAYABLE: anya-storage-plus-0.3.0-beta.7-skyglass.2.jar
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: actions/download-artifact@v4
        with:
          name: anya-storage-plus-roombuild.1
          run-id: 44938546132
          github-token: ${{ github.token }}
          path: reference
      - name: Build the playable from the verified backpack version
        run: |
          set -euo pipefail
          test "$(cat reference/SOURCE_COMMIT.txt)" = 687386239c8b9e027271c09e5e1149cfa03b1214
          (cd reference && sha256sum --check SHA256SUMS.txt)
          gradle --no-daemon --max-workers=2 --console=plain jar
          mkdir -p upload
          cp "build/libs/$PLAYABLE" upload/
          gradle --no-daemon --max-workers=2 --console=plain -I fixtures/skyglass/fixture.gradle -PimagePlayable="$PWD/upload/$PLAYABLE" prepareImageServer prepareImageClient
      - name: Check camera sampling and access on a dedicated room
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
          python3 -B fixtures/skygrid/run.py | tee upload/CHECKS.txt
          git rev-parse HEAD > upload/SOURCE_COMMIT.txt
          (cd upload && sha256sum "$PLAYABLE" > SHA256SUMS.txt)
      - name: Show fixture failures
        if: failure()
        run: |
          ls build/skygrid/Client/{noon,roof,night,rain} || true
          cat build/skygrid/Client/last-camera || true
          cat build/skygrid/Server/FAILED || true
          for f in build/skygrid/{Server,Client}/{console,restart}.log; do
            if test -f "$f"; then tail -45 "$f" | cut -c1-900; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: anya-storage-plus-skyglass.2
          path: upload/
          retention-days: 14
