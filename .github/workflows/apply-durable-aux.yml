name: Apply guarded auxiliary durability experiment
on:
  push:
    branches: [feature/elemental-pockets]
    paths: ['scripts/reviewed-durable-aux.b64', '.github/workflows/apply-durable-aux.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply only preconditioned experiment files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,subprocess
          p=Path('scripts/reviewed-durable-aux.b64')
          raw=lzma.decompress(base64.b64decode(p.read_text(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='da723b394a30dc9c36099eee319a072bac79ee05dac7df2b4c90458e054e1004'
          data=json.loads(raw)
          for name,digest in data['old'].items():
              assert name.startswith(('src/durableProbe/','scripts/durable_'))
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,'Source changed: '+name
          for name in data['new']:
              assert name.startswith('src/durableProbe/') and '..' not in Path(name).parts and not Path(name).exists()
          patch=data['patch'].encode()
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for name,text in data['new'].items():
              f=Path(name);f.parent.mkdir(parents=True,exist_ok=True);f.write_text(text)
          p.unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*data['old'].keys(),*data['new'].keys(),str(p)],check=True)
          subprocess.run(['git','commit','-m','Fence strict POI snapshots and region writes before READY; verify raw auxiliary data on restart'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/feature/elemental-pockets'],check=True)
          PY
