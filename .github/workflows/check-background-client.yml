name: Background client mouse and sound isolation
on:
  push:
    branches: [experiment/background-client-isolation]
permissions: {contents: read}
jobs:
  isolated-window:
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pywin32==310
      - run: python -B fixtures/background-client/check_windows.py
