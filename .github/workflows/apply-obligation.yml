name: Preserve original save on secondary journal failure
on:
  push:
    branches: [feature/elemental-pockets]
    paths: ['scripts/reviewed-obligation.json', '.github/workflows/apply-obligation.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact preconditioned experimental repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          patch=Path('scripts/reviewed-obligation.json');changes=json.loads(patch.read_text())
          for name,item in changes.items():
              p=Path(name)
              assert name.startswith(('src/repairProbe/','scripts/repair')) and '..' not in p.parts
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['prior'], 'Changed source: '+name
          for name,item in changes.items():
              p=Path(name);s=p.read_text()
              for old,new in item['edits']:
                  assert s.count(old)==1, 'Patch precondition: '+name
                  s=s.replace(old,new)
              p.write_text(s)
          patch.unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*changes.keys(),str(patch)],check=True)
          subprocess.run(['git','commit','-m','Preserve primary save attempt after snapshot encoding failure and test durable fallback'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/feature/elemental-pockets'],check=True)
          PY
