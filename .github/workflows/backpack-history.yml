name: Backpack loss and operator recovery
on:
  push:
    branches: [experiment/backpack-history]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYABLE: anya-storage-plus-0.3.0-beta.7-baghistory.1.jar
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 16}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Build and freeze the cumulative playable JAR
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0fd6b826580533e4d4a94f0c3bafb4104e733718 HEAD
          gradle --no-daemon --console=plain --max-workers=2 jar
          mkdir upload
          cp "build/libs/$PLAYABLE" upload/
          git rev-parse HEAD > upload/SOURCE_COMMIT.txt
          (cd upload && sha256sum "$PLAYABLE" > SHA256SUMS.txt)
      - name: Exercise loss, restore and replay on one disposable world
        run: |
          python3 -u -B fixtures/backpack-history/run.py "upload/$PLAYABLE"
          cp build/bag-history/CHECKS.txt upload/
          (cd upload && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bag-history-diagnostics
          path: |
            build/bag-history/*.log
            build/bag-history/game/crash-reports/*.txt
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: anya-storage-plus-baghistory.1
          path: upload
          if-no-files-found: error
          retention-days: 14
