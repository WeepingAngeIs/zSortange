name: Apply reviewed multi-pocket acceptance
on:
  push:
    branches: [feature/elemental-pockets]
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact guarded test-only changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,json,subprocess
          source=Path('scripts/reviewed-multi.b64')
          manifest=Path('scripts/reviewed-multi-pre.json')
          if source.exists():
              expected=json.loads(manifest.read_text())
              for name,digest in expected.items():
                  p=Path(name)
                  assert (not p.exists()) if digest is None else (p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest), 'Source changed: '+name
              patch=lzma.decompress(base64.b64decode(source.read_text(),validate=True))
              assert hashlib.sha256(patch).hexdigest()=='3443645e9d1481e42c7bfac34e830d806112f93a4d85f4af843fca0f039e3c18'
              subprocess.run(['git','apply','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','-'],input=patch,check=True)
              source.unlink();manifest.unlink()
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','add','--',*expected.keys(),str(source),str(manifest)],check=True)
              subprocess.run(['git','commit','-m','Add independent two-owner multi-pocket acceptance and beta.6 quick checklist'],check=True)
              subprocess.run(['git','push','origin','HEAD:refs/heads/feature/elemental-pockets'],check=True)
          PY
