name: Build and test the Creative Tablet

on:
  push:
    branches: [experiment/cupid-shy-tablet]

permissions:
  contents: read

concurrency:
  group: pocket-planner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare software rendering and image reading
        run: |
          if ! /usr/bin/python3 -c 'import PIL.Image' || ! command -v xvfb-run || ! command -v xauth; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-pil xvfb xauth libgl1-mesa-dri
          fi
      - name: Build the playable JAR and isolated camera
        run: gradle --no-daemon --max-workers=2 -I scripts/durable-audit-init.gradle -I fixtures/moon-console/init.gradle clean jar moonCameraJar createMoonVisualLaunchScript durableAuditClasspath
      - name: Check the tablet grip, Escape return and default policies
        shell: bash
        run: |
          set -euo pipefail
          jar=$(realpath build/libs/anya-storage-plus-*-creativetablet.1.jar)
          cp_file="$PWD/build/durable-audit/check.args"
          printf -- '-classpath\n"%s"\n' "$(cat build/durable-audit/classpath.txt)" > "$cp_file"
          args=(--jdk "$JAVA_HOME" --classpath-file "$cp_file" --support-jar "$jar")
          python3 -B fixtures/tablet-chance/check_opening_sources.py "$jar"
          python3 -B fixtures/tablet-chance/check_server.py "${args[@]}" --packaged
          python3 -B fixtures/tablet-handling/run_check.py "${args[@]}" --packaged
          python3 -B fixtures/tablet-handling/run_use.py "${args[@]}" --packaged
          python3 -B fixtures/tablet-handling/run_native_arm.py "${args[@]}"
          /usr/bin/python3 fixtures/tablet-handling/check_shy_sprites.py "$jar"
          client_jar="${GRADLE_USER_HOME:-$HOME/.gradle}/caches/neoformruntime/artifacts/minecraft_1.21.1_client.jar"
          test -f "$client_jar"
          printf -- '-classpath\n"%s:%s"\n' "$(cat build/durable-audit/classpath.txt)" "$client_jar" > "$cp_file"
          python3 -B fixtures/furniture/check.py "${args[@]}"
      - name: Check packaged model geometry, pixels and cube audio
        run: |
          jar=$(realpath build/libs/anya-storage-plus-*-creativetablet.1.jar)
          /usr/bin/python3 scripts/check_hub_console.py "$jar" --preview build/moon-review/hub-console.gif
          python3 scripts/check_moon_cube_jar.py "$jar"
          /usr/bin/python3 fixtures/moon-console/disc_gallery.py "$jar" build/moon-review/upgrade-discs.png
      - name: Film the packaged mod on a disposable Minecraft client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          mkdir -p build/moon-review/client
          printf 'onboardAccessibility:false\ntutorialStep:none\nenableVsync:false\nrenderDistance:5\nsimulationDistance:5\n' > build/moon-review/client/options.txt
          timeout 15m xvfb-run -a -s '-screen 0 1024x768x24' gradle --no-daemon --max-workers=2 -I fixtures/moon-console/init.gradle runMoonVisual > build/moon-review/launch.log 2>&1 || {
            grep -E 'Creative camera|Timed out|Timeout at|Caused by:|Creative Tablet:|AssertionError|IllegalStateException|Root checks' build/moon-review/launch.log | tail -n 80 || true
            tail -n 25 build/moon-review/launch.log
            exit 1
          }
          test -s build/moon-review/client/camera.txt
          jar=$(realpath build/libs/anya-storage-plus-*-creativetablet.1.jar)
          grep -F "$(sha256sum "$jar" | cut -d' ' -f1)" build/moon-review/client/camera.txt
          /usr/bin/python3 fixtures/moon-console/check_frames.py "$jar" build/moon-review/client/screenshots
          /usr/bin/python3 fixtures/moon-console/check_room_frames.py "$jar" build/moon-review/client/screenshots
          test -s build/moon-review/client/storage-checks.txt
          test -s build/moon-review/client/creative-tablet.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creativetablet-camera
          path: |
            build/moon-review/client/screenshots/*.png
            build/moon-review/client/camera.txt
            build/moon-review/upgrade-discs.png
            build/moon-review/client/room-camera.txt
            build/moon-review/client/storage-checks.txt
            build/moon-review/client/creative-tablet.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify and prepare the test artifact
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          jar="anya-storage-plus-$version.jar"
          mkdir -p upload
          cp "build/libs/$jar" upload/
          python3 - "$jar" "$version" <<'PY'
          from pathlib import Path
          import json
          import sys
          import tomllib
          from zipfile import ZipFile

          with ZipFile(Path("upload") / sys.argv[1]) as jar:
              assert jar.testzip() is None
              mod = tomllib.loads(jar.read("META-INF/neoforge.mods.toml").decode())["mods"][0]
              assert mod["modId"] == "anyastorage" and mod["version"] == sys.argv[2]
              for name in ("RoomPlans", "ChestPadGuide", "PocketRoomLayout", "ChestLayoutProjection"):
                  assert f"dev/anya/storage/pocket/{name}.class" in jar.namelist()
              for class_name, marker in (
                  ("StoreMenu", b"upgrade pads occupied"),
                  ("Client$Screen", b"drawPocketPadSummary"),
                  ("pocket/ChestPadGuide", b"Room upgrades"),
              ):
                  assert marker in jar.read(f"dev/anya/storage/{class_name}.class")
              print("PASS: candidate JAR includes the upgrade readout and planner link")
              for name in ("tablet_device", "tablet_guardian", "tablet_gaze_left"):
                  entry = f"assets/anyastorage/textures/gui/{name}.png"
                  assert jar.read(entry) == (Path("src/main/resources") / entry).read_bytes()

              assets = "assets/anyastorage/"
              model = json.loads(jar.read(assets + "models/item/cupid_tablet.json"))
              assert model["parent"] == "anyastorage:item/cupid_tablet_shell"
              shell = json.loads(jar.read(assets + "models/item/cupid_tablet_shell.json"))
              assert len(shell["elements"]) == 1 and len(shell["elements"][0]["faces"]) == 6
              for name in ("cupid_tablet_face.png", "cupid_tablet_face.png.mcmeta", "cupid_tablet_case.png"):
                  entry = assets + "textures/item/" + name
                  assert jar.read(entry) == (Path("src/main/resources") / entry).read_bytes()
              assert assets + "models/item/remote.json" in jar.namelist()
              lang = json.loads(jar.read(assets + "lang/en_us.json"))
              assert lang["item.anyastorage.cupid_tablet"] == "Cupid Tablet"
              recipe = json.loads(jar.read("data/anyastorage/recipe/cupid_tablet.json"))
              assert recipe["result"]["id"] == "anyastorage:cupid_tablet"
              assert recipe["neoforge:conditions"] == [{"type":"anyastorage:recipe_group","group":"terminals"}]
              assert all(ingredient.get("item") != "anyastorage:remote" for ingredient in recipe["key"].values())
              for entry in ("data/anyastorage/dimension/pockets.json",
                            "data/anyastorage/dimension_type/pockets.json",
                            "dev/anya/storage/ServerSettings.class",
                            "dev/anya/storage/StorageSettingsCommands.class",
                            "dev/anya/storage/appearance/TabletHandMotion.class"):
                  assert entry in jar.namelist(), entry
              guide = jar.read("dev/anya/storage/guide/GuideContent.class")
              for marker in (b"Start with 54 slots", b"216-slot UwU Storage Cube",
                             b"cubeUnavailable", b"Shapeless recipe", b"Storage Core"):
                  assert marker in guide
              cube = json.loads(jar.read("data/anyastorage/recipe/uwu_cube.json"))
              assert cube["type"] == "anyastorage:cube"
              core = json.loads(jar.read("data/anyastorage/recipe/storage_core.json"))
              assert core["pattern"] == ["DDD", "DND", "DDD"]
              assert core["key"] == {"D":{"item":"minecraft:diamond_block"},
                                     "N":{"item":"minecraft:netherite_block"}}
              print("PASS: starter-to-UwU guide and existing endgame recipes packaged")
          PY
          sed 's/TABLET_OPENING_CHANCE\.md/CUPID-SETTINGS.md/g' docs/FIELD_KIT.md > upload/FIELD-KIT.md
          cp docs/TABLET_OPENING_CHANCE.md upload/CUPID-SETTINGS.md
          cp docs/SHYCUPID-CHANGELOG.txt upload/CHANGELOG.txt
          cp docs/SHYCUPID-PLAYTEST.txt upload/PLAYTEST.txt
          cp docs/SERVER_SETTINGS.md upload/SERVER-SETTINGS.md
          git rev-parse HEAD > upload/SOURCE_COMMIT.txt
          (cd upload && sha256sum "$jar" > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: anya-storage-plus-creativetablet.1
          path: upload/
          if-no-files-found: error
          retention-days: 14
