name: Storage release qualification - independent owner during custody
on:
  push:
    branches: [qualify/storage-release-1]
    paths:
      - fixtures/release/custody/**
      - .github/workflows/storage-custody-qualification.yml
permissions:
  contents: read
  actions: read
jobs:
  pack-custody:
    name: Published-pack admission and two distinct bag owners
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UQ_ACCESSORY_INTEGRATION: '1'
      POLYMORPH_CONTROLS: '1'
      STORAGE_SHA: afd62612c2f09c6bf156831b0e798da58ef0fd1632297dc936ea69e11b66e91e
      COMBINED_STORAGE_JAR: ${{ github.workspace }}/storage-input/anya-storage-plus-0.3.0-beta.7-roommedia.1.jar
      CUSTODY_JAR: ${{ github.workspace }}/jail-input/candidate/dist/migration-build/Minecraft-Jail-1.3.0-beta.4-test.1.jar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: WeepingAngeIs/Server-Jars
          ref: 6cdcc0c64aeefdd1a00ecbd44311413759c5cf3f
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: storage-check, persist-credentials: false}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: anya-storage-plus-roommedia.1, run-id: 45230324007, github-token: '${{ github.token }}', path: storage-input}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: combined-pack-evidence-6cdcc0c64aeefdd1a00ecbd44311413759c5cf3f
          repository: WeepingAngeIs/Server-Jars
          run-id: 45397099022
          github-token: ${{ github.token }}
          path: jail-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jail-production-build-7b2f6b34412403b0839f1be9b82e136d1d893b20
          repository: WeepingAngeIs/Server-Jars
          run-id: 44099299150
          github-token: ${{ github.token }}
          path: baseline
      - name: Prepare only the disposable observer with frozen product JARs
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$STORAGE_SHA" "$COMBINED_STORAGE_JAR" | sha256sum -c -
          printf '%s  %s\n' 6907d0bd9c2dd4b678cb9f6a241a3a58e1a23b6df35a0b9f0afac2defd80c47f "$CUSTODY_JAR" | sha256sum -c -
          printf '%s  %s\n' 61f6add6c68364b1c9dda4486948faf8d104c45ca2db2c40199de64a04ea38f7 baseline/dist/production-candidate/Unyielding-1.2.0.jar | sha256sum -c -
          mkdir -p dist/120-release minecraft-jail/build/libs
          cp baseline/dist/production-candidate/Unyielding-1.2.0.jar dist/120-release/
          cp "$CUSTODY_JAR" minecraft-jail/build/libs/Minecraft-Jail-1.2.0.jar
          python3 .github/scripts/fetch-build-dependencies.py
          python3 storage-check/fixtures/release/custody/prepare.py
          python3 .github/native249/combined_prepare.py
      - name: Prepare the full-pack runner memory and display
        run: |
          set -euo pipefail
          if ! command -v xvfb-run; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxcursor1 libxinerama1
          fi
          python3 -m pip install --disable-pip-version-check minecraft-launcher-lib==8.0
          bash .github/client249/memory.sh
      - name: Provision the published dedicated pack
        timeout-minutes: 18
        run: PACK249_INSTALL_ONLY=1 bash .github/pack249/server.sh
      - name: Provision the published client
        timeout-minutes: 18
        run: |
          set -euo pipefail
          python3 .github/pack249/provision.py --side client --dest "$RUNNER_TEMP/pack249-client-native"
          python3 .github/client249/launch.py "$RUNNER_TEMP/pack249-client-native" --install-only
      - name: Run admission and independent recovery in the established capped game process
        timeout-minutes: 30
        run: bash .github/native249/independent-scope.sh 1 "$CUSTODY_JAR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: storage-independent-custody-evidence
          path: |
            independent-evidence/
            dist/packaged-smoke/full249-scope-logs/
            dist/packaged-smoke/independent-progress.txt
            dist/packaged-smoke/client249-phase1-status.txt
          retention-days: 14
