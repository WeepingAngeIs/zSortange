name: Apply reviewed fixture lease-lifetime distinction
on:
  push:
    branches: [feature/elemental-pockets]
    paths: ['scripts/reviewed-lease-lifetime.b64', '.github/workflows/apply-efficient.yml']
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Preserve deadlines for live views, not deliberately replaced sessions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,subprocess
          src=Path('scripts/reviewed-lease-lifetime.b64')
          raw=lzma.decompress(base64.b64decode(src.read_text(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='f89ea0ed73a29b0028985bd57026aa0c319bd6183ddd048a13f3202b5a630762'
          payload=json.loads(raw)
          for name,old in payload['expected'].items():
              assert name.startswith('src/ticketExperiment/'), 'Not an experiment file'
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==old, 'Source changed: '+name
          patch=payload['patch'].encode()
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          src.unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*payload['expected'].keys(),str(src)],check=True)
          subprocess.run(['git','commit','-m','Keep independent live-view deadline checks distinct from explicitly closed fixture sessions'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/feature/elemental-pockets'],check=True)
          PY
