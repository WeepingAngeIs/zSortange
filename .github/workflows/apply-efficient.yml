name: Apply guarded per-pocket experiment
on:
  push:
    branches: [feature/elemental-pockets]
    paths: ['scripts/reviewed-efficient.b64', '.github/workflows/apply-efficient.yml']
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply preconditioned test-only changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,subprocess
          src=Path('scripts/reviewed-efficient.b64')
          raw=lzma.decompress(base64.b64decode(src.read_text(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='de6c1a9ba87c473caee15ca1200f263b109d54d005172d03f8bf933d392ccc91'
          payload=json.loads(raw)
          for name,old in payload['expected'].items():
              p=Path(name)
              assert not p.is_absolute() and '..' not in p.parts and not name.startswith(('src/main/','.github/')), 'Not a fixture path: '+name
              assert (not p.exists()) if old is None else (p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==old), 'Source changed: '+name
          patch=payload['patch'].encode()
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          src.unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*payload['expected'].keys(),str(src)],check=True)
          subprocess.run(['git','commit','-m','Implement isolated once-per-pocket eligibility and bounded eight-pocket transition churn'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/feature/elemental-pockets'],check=True)
          PY
