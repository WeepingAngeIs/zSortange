name: Advanced backpack feeding
on:
  push:
    branches: [experiment/advanced-feeding]

permissions:
  contents: read
  actions: read

concurrency:
  group: advanced-feeding-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 42
    env:
      PLAYABLE: anya-storage-plus-0.3.0-beta.7-feeding.1.jar
      BASELINE: anya-storage-plus-0.3.0-beta.7-cookers.1.jar
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Retrieve the verified cookers.1 package
        uses: actions/download-artifact@v4
        with:
          name: anya-storage-plus-cookers.1
          path: reference
          github-token: ${{ github.token }}
          run-id: 44874113092

      - name: Build the playable and compare it with cookers.1
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat reference/SOURCE_COMMIT.txt)" = 86d7922a1ee23f24439fcf45d2329ee1a6225c18
          (cd reference && sha256sum --check SHA256SUMS.txt)
          gradle --no-daemon --console=plain --max-workers=2 -I scripts/durable-audit-init.gradle jar durableAuditClasspath
          mkdir -p upload build/advanced-feeding/hover
          cp "build/libs/$PLAYABLE" upload/
          if ! /usr/bin/python3 -c 'import PIL.Image'; then
            sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
          fi
          jar=$(realpath "upload/$PLAYABLE")
          /usr/bin/python3 -B fixtures/advanced-feeding/check_package.py "$jar" "reference/$BASELINE" | tee upload/CHECKS.txt
          vanilla="${GRADLE_USER_HOME:-$HOME/.gradle}/caches/neoformruntime/artifacts/minecraft_1.21.1_client.jar"
          test -f "$vanilla"
          cp="$jar:$(cat build/durable-audit/classpath.txt):$vanilla"
          javac --release 21 -proc:none -cp "$cp" -d build/advanced-feeding/hover fixtures/item-help/HoverCheck.java
          java -cp "build/advanced-feeding/hover:$cp" dev.anya.storage.HoverCheck "$jar" | tee build/advanced-feeding/hover.txt
          grep -F '43 items and rendered both backpack value placeholders' build/advanced-feeding/hover.txt >> upload/CHECKS.txt
          (cd upload && sha256sum "$PLAYABLE" > SHA256SUMS.txt)

      - name: Verify feeding on a disposable plain server
        shell: bash
        run: |
          set -euo pipefail
          python3 -u -B fixtures/advanced-feeding/run.py "upload/$PLAYABLE"
          cat build/advanced-feeding/plain/CHECKS.txt >> upload/CHECKS.txt

      - name: Fetch the two publisher releases and verify their installed-profile hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/feeding-deps
          cd build/feeding-deps
          curl --fail --silent --show-error --proto '=https' --retry 3 --connect-timeout 15 --max-time 90 \
            'https://cdn.modrinth.com/data/eHGYGKJz/versions/4YRKCovn/Spice%20of%20Life%20Onion_NEOFORGE_v1.5.6_mc1.21.1.jar' -o solonion.jar
          curl --fail --silent --show-error --proto '=https' --retry 3 --connect-timeout 15 --max-time 90 \
            'https://cdn.modrinth.com/data/OsZiaDHq/versions/vn4lrETC/CreativeCore_NEOFORGE_v2.13.49_mc1.21.1.jar' -o creativecore.jar
          sha256sum --check - <<'HASHES'
          11605cfec2ac2e6385fc119d01bb6633b8a9ce8fdf0614cd272254630d56c0a7  solonion.jar
          39506208ad0c7efb2c9ac8128766425faebf50c408ec869d5f5043c0742c231b  creativecore.jar
          HASHES

      - name: Verify feeding and food history with Spice of Life Onion
        shell: bash
        run: |
          set -euo pipefail
          python3 -u -B fixtures/advanced-feeding/run.py "upload/$PLAYABLE" \
            --provider build/feeding-deps/solonion.jar --core build/feeding-deps/creativecore.jar
          cat build/advanced-feeding/provider/CHECKS.txt >> upload/CHECKS.txt
          cp docs/MODULE_PROGRESSION.md docs/STORAGE_UPGRADE_REFERENCE.md upload/
          printf '\n## Hosted Advanced Feeding check\n\nThe packaged JAR passed the item checks and both disposable server runs at commit `%s`. [GitHub build and receipts](%s/%s/actions/runs/%s).\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> upload/MODULE_PROGRESSION.md
          git rev-parse HEAD > upload/SOURCE_COMMIT.txt
          (cd upload && sha256sum --check SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hosted-feeding-diagnostics
          path: |
            build/advanced-feeding/*/*.log
            build/advanced-feeding/*/game/crash-reports/*.txt
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: anya-storage-plus-feeding.1
          path: upload/
          if-no-files-found: error
          retention-days: 14
