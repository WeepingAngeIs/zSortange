name: Minimal stale ownership and targeted drainage
on:
  push:
    branches: [feature/elemental-pockets]
    paths: ['src/minimalProbe/**', 'scripts/minimal*', '.github/workflows/minimal-ownership.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minimal-ownership-${{ github.sha }}
  cancel-in-progress: false
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [baseline-first, candidate-first, dirty-cycles, failure-cancel, cuts-restart]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Compile isolated queue-free module and unchanged beta.6
        run: |
          mkdir -p build/minimal-evidence
          set -o pipefail
          gradle --no-daemon --max-workers=2 -I scripts/minimal-init.gradle jar minimalProbeJar 2>&1 | tee build/minimal-evidence/compile.log
          python3 scripts/minimal_verify_jar.py | tee build/minimal-evidence/module-check.log
      - name: Bounded lean comparisons dirty cycles or exact durability regressions
        env:
          ANYA_DURABLE_LANE: ${{ matrix.lane }}
        run: |
          set -o pipefail
          python3 scripts/minimal_runtime.py 2>&1 | tee build/minimal-evidence/controller.log
      - name: Export separate diagnostic recordings
        if: always()
        run: python3 scripts/minimal_jfr_export.py
      - name: Preserve exact source and checksums
        if: always()
        run: |
          mkdir -p build/minimal-evidence
          git rev-parse HEAD > build/minimal-evidence/SOURCE_COMMIT.txt
          git archive --format=zip HEAD > build/minimal-evidence/source.zip
          sha256sum build/libs/*.jar build/minimal/*.jar > build/minimal-evidence/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-${{ matrix.lane }}-${{ github.sha }}
          path: |
            build/minimal-evidence/
            build/durable-runtime/evidence/
          if-no-files-found: error
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: room
            evidence: build/acceptance/evidence
          - scenario: cold-recovery
            evidence: build/cold-recovery/evidence
          - scenario: transitions
            evidence: build/remote-policy/evidence
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Compile exact candidate and unchanged actual-client fixtures
        run: |
          mkdir -p '${{ matrix.evidence }}'
          set -o pipefail
          gradle --no-daemon --max-workers=2 -I scripts/minimal-init.gradle jar minimalProbeJar acceptanceJar ticketExperimentJar stageAcceptanceDependencies exportAcceptanceLaunches -PminimalProbe -PticketExperiment 2>&1 | tee '${{ matrix.evidence }}/compile.log'
          python3 scripts/minimal_verify_jar.py | tee '${{ matrix.evidence }}/module-check.log'
      - name: Prepare disposable software display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Two actual clients with queue-free candidate recovery shutdown restart
        env:
          JAVA_TOOL_OPTIONS: '-Danya.nonblockingPrepare=true -Danya.minimalOwnership=true'
          ANYA_DURABLE_PROBE: 'true'
          ANYA_ACCEPTANCE_SCENARIO: room
          ANYA_ROOM_TICKET_EXPERIMENT: 'true'
          ANYA_COLD_POLICY: candidate
          ANYA_MINIMAL_CLIENT_SCENARIO: ${{ matrix.scenario }}
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1920x1200x24' python3 scripts/minimal_clients.py 2>&1 | tee '${{ matrix.evidence }}/controller.log'
      - name: Preserve exact source and checksums
        if: always()
        run: |
          mkdir -p '${{ matrix.evidence }}'
          git rev-parse HEAD > '${{ matrix.evidence }}/SOURCE_COMMIT.txt'
          git archive --format=zip HEAD > '${{ matrix.evidence }}/source.zip'
          sha256sum build/libs/*.jar build/minimal/*.jar build/ticket-experiment/*.jar > '${{ matrix.evidence }}/SHA256SUMS.txt' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-clients-${{ matrix.scenario }}-${{ github.sha }}
          path: ${{ matrix.evidence }}/
          if-no-files-found: error
