name: Build and verify Anya Storage
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply reviewed dedicated-runtime correction
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/elemental-pockets'
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64,hashlib,lzma,subprocess
          source=Path('scripts/reviewed-runtime.b64')
          if source.exists():
              expected={'build.gradle':'74cf1b600d7ced7864981bb44622e0b0278ee3aeee809ff280e322159cf32d7c','src/main/java/dev/anya/storage/pocket/PocketGameTests.java':'531285b008beb0253abb0076ccce1987273a12044d30f43decb6b3b2abe79fd8','src/main/java/dev/anya/storage/pocket/PocketService.java':'a92983192b43af63c84e7792dc6c16134d78d27c1a292cc49899e71c19fe95e1','src/main/java/dev/anya/storage/pocket/PocketRuntimeSmoke.java':None}
              for name,digest in expected.items():
                  p=Path(name)
                  assert (not p.exists()) if digest is None else (p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest), 'Source changed: '+name
              patch=lzma.decompress(base64.b64decode(source.read_text(),validate=True))
              assert hashlib.sha256(patch).hexdigest()=='c59ed5f3fff990b47f7f0f27a2fc193c915551ffadaa033892cf571e0806390f'
              subprocess.run(['git','apply','--check','--unidiff-zero','-'],input=patch,check=True)
              subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
              source.unlink()
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','add','--',*expected.keys(),str(source)],check=True)
              subprocess.run(['git','commit','-m','Run dimension lifecycle on a real dedicated server and harden recovery boundaries'],check=True)
              subprocess.run(['git','push','origin','HEAD:refs/heads/feature/elemental-pockets'],check=True)
          PYCODE
      - name: Export exact source snapshot
        run: |
          mkdir -p export
          git rev-parse HEAD > export/SOURCE_COMMIT.txt
          git archive --format=zip HEAD > export/anya-storage-plus-repository-source.zip
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: always
      - name: Build and test core
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean build 2>&1 | tee export/build-output.log
      - name: Run Minecraft game tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon runGameTestServer 2>&1 | tee export/game-test-output.log
      - name: Test with the actual optional Accessories dependency
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon runGameTestServer -PaccessoriesTest 2>&1 | tee export/accessories-test-output.log
          grep -q 'ANYA_ACCESSORIES_CONTRACT_OK' export/accessories-test-output.log
      - name: Exercise gated pocket runtime in a disposable world
        shell: bash
        run: |
          set -o pipefail
          test ! -e run-pocket-tests/world
          mkdir -p run-pocket-tests
          printf 'eula=true\n' > run-pocket-tests/eula.txt
          printf 'level-name=world\nlevel-type=minecraft:flat\ngenerate-structures=false\nonline-mode=false\nview-distance=2\nsimulation-distance=2\nspawn-protection=0\nserver-ip=127.0.0.1\nserver-port=25578\n' > run-pocket-tests/server.properties
          timeout 240s gradle --no-daemon runServer -PpocketTest 2>&1 | tee export/pocket-runtime-output.log
          grep -q 'ANYA_POCKET_RUNTIME_OK' export/pocket-runtime-output.log
      - name: Verify guide and shared bases across a dedicated-server restart
        shell: bash
        run: |
          set -o pipefail
          mkdir -p run-guide-persistence
          test ! -e run-guide-persistence/world
          printf 'eula=true\n' > run-guide-persistence/eula.txt
          printf 'level-name=world\nlevel-type=minecraft:flat\ngenerate-structures=false\nonline-mode=false\nview-distance=2\nsimulation-distance=2\nspawn-protection=0\nserver-ip=127.0.0.1\nserver-port=25579\n' > run-guide-persistence/server.properties
          timeout 180s gradle --no-daemon runServer -PguidePersistence=seed 2>&1 | tee export/guide-persistence-seed.log
          grep -q 'ANYA_GUIDE_PERSISTENCE_SEED' export/guide-persistence-seed.log
          timeout 180s gradle --no-daemon runServer -PguidePersistence=verify 2>&1 | tee export/guide-persistence-verify.log
          grep -q 'ANYA_GUIDE_PERSISTENCE_VERIFY' export/guide-persistence-verify.log
          grep -q 'ANYA_SHARED_BASE_PERSISTENCE_SEED' export/guide-persistence-seed.log
          grep -q 'ANYA_SHARED_BASE_PERSISTENCE_VERIFY' export/guide-persistence-verify.log
          grep -q 'ANYA_POCKET_RESTART_SEED' export/guide-persistence-seed.log
          grep -q 'ANYA_POCKET_RESTART_VERIFY' export/guide-persistence-verify.log
      - name: Install software-rendering display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Start Minecraft client and inspect rendered assets
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          set -o pipefail
          mkdir -p run-client-smoke
          printf 'enableVsync:false\nguiScale:1\nmaxFps:30\n' > run-client-smoke/options.txt
          timeout 300s xvfb-run -a -s '-screen 0 1600x1200x24' gradle --no-daemon runClient -PclientSmoke 2>&1 | tee export/client-smoke-output.log
          grep -q 'ANYA_CLIENT_SMOKE_OK' export/client-smoke-output.log
          cp run-client-smoke/screenshots/anya-*-client.png export/
      - name: Inspect client with actual Accessories dependency
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          set -o pipefail
          mkdir -p run-client-accessories-smoke
          printf 'enableVsync:false\nguiScale:1\nmaxFps:30\n' > run-client-accessories-smoke/options.txt
          timeout 300s xvfb-run -a -s '-screen 0 1600x1200x24' gradle --no-daemon runClient -PclientSmoke -PaccessoriesTest 2>&1 | tee export/client-accessories-output.log
          grep -q 'ANYA_CLIENT_SMOKE_OK' export/client-accessories-output.log
          grep -q 'ANYA_ACCESSORIES_CLIENT_OK' export/client-accessories-output.log
          for file in run-client-accessories-smoke/screenshots/anya-*-client.png; do name=$(basename "$file"); cp "$file" "export/anya-accessories-${name#anya-}"; done
      - name: Checksums and exact source
        run: |
          cp export/* build/libs/
          cp -r docs build/libs/docs
          sha256sum build/libs/*.jar > build/libs/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: anya-storage-plus-${{ env.SOURCE_COMMIT }}
          path: build/libs/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ github.sha }}
          path: |
            build/reports/
            run*/logs/
            run-client-smoke/screenshots/
            export/
          if-no-files-found: ignore
