name: Apply reviewed pocket checkpoint
on:
  push:
permissions:
  contents: write
jobs:
  checkpoint:
    if: github.ref == 'refs/heads/feature/elemental-pockets'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded local refinement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,subprocess
          source=Path('scripts/reviewed-final-pocket.b64')
          if source.exists():
              expected={'docs/POCKET_MILESTONE.md':'c9714dbcc58bd65329a1f45d210cf69dbbb0e9c9936338f434f2f1e561948306','src/main/java/dev/anya/storage/appearance/ClientSmoke.java':'455c756c6eb0a26e72535395a063f61ac3982d45b090de49e2100e6721142724','src/main/java/dev/anya/storage/pocket/PocketContent.java':'c3d6ff432303e13522cf6f3aa38c2efd9f269defd138de2854b8f6e3b58a0449','src/main/java/dev/anya/storage/pocket/PocketPreviewParticles.java':None,'src/main/java/dev/anya/storage/pocket/PocketRuntimeSmoke.java':'04a0f78d220dac145e28d3cbd03c8f05632a6799a6cdc992cdfcf0516e85db07'}
              for name,digest in expected.items():
                  p=Path(name)
                  assert (not p.exists()) if digest is None else (p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest), 'Source changed: '+name
              patch=lzma.decompress(base64.b64decode(source.read_text(),validate=True))
              assert hashlib.sha256(patch).hexdigest()=='3c5c5c8cbda2447600fdb5ef9f761d8496956e6ee3fc58f67a462a28b1f362ad'
              subprocess.run(['git','apply','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','-'],input=patch,check=True)
              source.unlink()
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','add','--',*expected.keys(),str(source)],check=True)
              subprocess.run(['git','commit','-m','Bound local preview decoration and verify actual idle destination unload'],check=True)
              subprocess.run(['git','push','origin','HEAD:refs/heads/feature/elemental-pockets'],check=True)
          PY
