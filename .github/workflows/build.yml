name: Build and verify Anya Storage
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export exact source snapshot
        run: |
          mkdir -p export
          git rev-parse HEAD > export/SOURCE_COMMIT.txt
          git archive --format=zip HEAD > export/anya-storage-plus-repository-source.zip
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: always
      - name: Build and test core
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean build 2>&1 | tee export/build-output.log
      - name: Run Minecraft game tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon runGameTestServer 2>&1 | tee export/game-test-output.log
      - name: Verify guide and shared bases across a dedicated-server restart
        shell: bash
        run: |
          set -o pipefail
          mkdir -p run-guide-persistence
          test ! -e run-guide-persistence/world
          printf 'eula=true\n' > run-guide-persistence/eula.txt
          printf 'level-name=world\nlevel-type=minecraft:flat\ngenerate-structures=false\nonline-mode=false\nview-distance=2\nsimulation-distance=2\nspawn-protection=0\nserver-ip=127.0.0.1\nserver-port=25579\n' > run-guide-persistence/server.properties
          timeout 180s gradle --no-daemon runServer -PguidePersistence=seed 2>&1 | tee export/guide-persistence-seed.log
          grep -q 'ANYA_GUIDE_PERSISTENCE_SEED' export/guide-persistence-seed.log
          timeout 180s gradle --no-daemon runServer -PguidePersistence=verify 2>&1 | tee export/guide-persistence-verify.log
          grep -q 'ANYA_GUIDE_PERSISTENCE_VERIFY' export/guide-persistence-verify.log
          grep -q 'ANYA_SHARED_BASE_PERSISTENCE_SEED' export/guide-persistence-seed.log
          grep -q 'ANYA_SHARED_BASE_PERSISTENCE_VERIFY' export/guide-persistence-verify.log
      - name: Install software-rendering display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Start Minecraft client and inspect rendered assets
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          set -o pipefail
          mkdir -p run-client-smoke
          printf 'enableVsync:false\nguiScale:1\nmaxFps:30\n' > run-client-smoke/options.txt
          timeout 300s xvfb-run -a -s '-screen 0 1600x1200x24' gradle --no-daemon runClient -PclientSmoke 2>&1 | tee export/client-smoke-output.log
          grep -q 'ANYA_CLIENT_SMOKE_OK' export/client-smoke-output.log
          cp run-client-smoke/screenshots/anya-*-client.png export/
      - name: Checksums and exact source
        run: |
          cp export/* build/libs/
          cp -r docs build/libs/docs
          sha256sum build/libs/*.jar > build/libs/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: anya-storage-plus-${{ env.SOURCE_COMMIT }}
          path: build/libs/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ github.sha }}
          path: |
            build/reports/
            run*/logs/
            run-client-smoke/screenshots/
            export/
          if-no-files-found: ignore
