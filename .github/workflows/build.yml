name: Build and verify Anya Storage
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build and test core
        run: gradle --no-daemon clean build
      - name: Run Minecraft game tests
        run: gradle --no-daemon runGameTestServer
      - name: Checksums and source archive
        run: |
          sha256sum build/libs/*.jar > build/libs/SHA256SUMS.txt
          git archive --format=zip HEAD > build/libs/anya-storage-plus-repository-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: anya-storage-plus-${{ github.sha }}
          path: build/libs/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ github.sha }}
          path: |
            build/reports/
            run*/logs/
          if-no-files-found: ignore
