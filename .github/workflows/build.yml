name: Build and verify Anya Storage
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed source corrections
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/anya-storage-beta'
        run: |
          if test -f scripts/repair_beta.py; then
            python3 scripts/repair_beta.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Apply reviewed beta safety and configuration corrections'
            git push origin HEAD:refs/heads/feature/anya-storage-beta
          fi
      - name: Export exact source snapshot
        run: |
          mkdir -p export
          git rev-parse HEAD > export/SOURCE_COMMIT.txt
          git archive --format=zip HEAD > export/anya-storage-plus-repository-source.zip
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ env.SOURCE_COMMIT }}
          path: export/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: always
      - name: Build and test core
        run: gradle --no-daemon clean build
      - name: Run Minecraft game tests
        run: gradle --no-daemon runGameTestServer
      - name: Checksums and exact source
        run: |
          cp export/* build/libs/
          sha256sum build/libs/*.jar > build/libs/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: anya-storage-plus-${{ env.SOURCE_COMMIT }}
          path: build/libs/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ github.sha }}
          path: |
            build/reports/
            run*/logs/
          if-no-files-found: ignore
