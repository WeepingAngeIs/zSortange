name: Build and test Anya Storage
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile and run configuration tests
        run: gradle --no-daemon clean build
      - name: Run NeoForge game tests
        run: gradle --no-daemon runGameTestServer
      - name: Package source and checksums
        run: |
          sha256sum build/libs/*.jar > build/libs/SHA256SUMS.txt
          git archive --format=zip HEAD -o build/libs/Anya-Storage-Plus-SOURCE.zip
      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: anya-storage-plus-${{ github.sha }}
          path: build/libs/
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.sha }}
          path: |
            build/reports/
            build/test-results/
            runs/**/logs/
            run*/logs/
          if-no-files-found: ignore
