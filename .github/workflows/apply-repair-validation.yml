name: Apply reviewed client and multikey repair validation
on:
  push:
    branches: [feature/elemental-pockets]
    paths: ['scripts/reviewed-repair-validation*', '.github/workflows/apply-repair-validation.yml']
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply preconditioned test-source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,subprocess
          parts=[Path(f'scripts/reviewed-repair-validation.{i}.b64') for i in range(4)]
          manifest=Path('scripts/reviewed-repair-validation-pre.json')
          expected=json.loads(manifest.read_text())
          for name,digest in expected.items():
              p=Path(name)
              assert not p.is_absolute() and '..' not in p.parts and not name.startswith('src/main/'), 'Invalid test path'
              assert (not p.exists()) if digest is None else (p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest), 'Source changed: '+name
          patch=lzma.decompress(base64.b64decode(''.join(p.read_text() for p in parts),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='d4df16671cd98db56d06bf90fcdb18d1d0f82a86836ea8440569c60594c604d3'
          excluded='--exclude=.github/workflows/repair-validation.yml'
          subprocess.run(['git','apply',excluded,'--check','-'],input=patch,check=True)
          subprocess.run(['git','apply',excluded,'-'],input=patch,check=True)
          for p in [*parts,manifest]:p.unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          names=[n for n in expected if not n.startswith('.github/')]
          subprocess.run(['git','add','--',*names,*[str(p) for p in parts],str(manifest)],check=True)
          subprocess.run(['git','commit','-m','Add actual-client quarantine and bounded multikey snapshot validation'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/feature/elemental-pockets'],check=True)
          PY
