name: Verify illustrated tutorial and wardrobe milestone
on:
  push:
    branches: [feature/elemental-pockets]
    paths: [.ci-expansion/**, .github/workflows/apply-expansion.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Apply hash-verified reviewed source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,shutil
          root=pathlib.Path('.'); parts=sorted(root.glob('.ci-expansion/*.b64'))
          assert len(parts)==3
          raw=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='93b904cc335f49d1badf45a5f949bf6aa73570d28aea60decab81608458d10ba'
          manifest=json.loads(lzma.decompress(raw)); prepared=[]
          for name,change in manifest.items():
              path=pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name.startswith(('src/','scripts/')) or name in ('build.gradle','gradle.properties')
              dest=root/name; old=dest.read_text() if dest.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest()==change['before'], name+' base changed'
              lines=old.splitlines(keepends=True)
              for lo,hi,text in reversed(change['edits']):lines[lo:hi]=[text]
              text=''.join(lines)
              assert hashlib.sha256(text.encode()).hexdigest()==change['after'], name+' delta mismatch'
              prepared.append((dest,text))
          for dest,text in prepared:dest.parent.mkdir(parents=True,exist_ok=True);dest.write_text(text)
          shutil.rmtree('.ci-expansion');pathlib.Path('.github/workflows/apply-expansion.yml').unlink()
          print('Applied',len(prepared),'verified source files')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Ancient Technology illustrated live guide, durable first-login grants and upload rate gates'
          git push origin HEAD:feature/elemental-pockets
          mkdir -p export
          git rev-parse HEAD > export/SOURCE_COMMIT.txt
          git archive --format=zip HEAD > export/anya-storage-plus-repository-source.zip
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false
      - name: Build and run configuration, PNG and durable grant tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean build 2>&1 | tee export/build-output.log
      - name: Run real Minecraft GameTests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon runGameTestServer 2>&1 | tee export/game-test-output.log
      - name: Install software-rendering display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Capture actual Minecraft backpack, interior and book rendering
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          set -o pipefail
          mkdir -p run-client-smoke
          printf 'enableVsync:false\nguiScale:1\nmaxFps:30\n' > run-client-smoke/options.txt
          timeout 300s xvfb-run -a -s '-screen 0 1600x1200x24' gradle --no-daemon runClient -PclientSmoke 2>&1 | tee export/client-smoke-output.log
          grep -q 'ANYA_CLIENT_SMOKE_OK' export/client-smoke-output.log
          cp run-client-smoke/screenshots/anya-*-client.png export/
      - name: Package tested source and JAR
        run: |
          cp export/* build/libs/
          cp -r docs build/libs/docs
          sha256sum build/libs/*.jar > build/libs/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: anya-storage-plus-${{ env.SOURCE_COMMIT }}
          path: build/libs/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guide-diagnostics-${{ github.sha }}
          path: |
            export/
            build/reports/
            run*/logs/
            run-client-smoke/screenshots/
          if-no-files-found: ignore
