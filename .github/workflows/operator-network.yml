name: Actual-client operator inspection and confirmation
on:
  push:
    branches: [feature/elemental-pockets]
    paths: ['src/operatorClient/**', 'scripts/operator-network-init.gradle', 'scripts/operator_network.py', '.github/workflows/operator-network.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operator-network-${{ github.sha }}
  cancel-in-progress: false
jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Compile existing operator module and isolated network fixtures
        run: |
          mkdir -p build/operator-network/evidence
          set -o pipefail
          gradle --no-daemon --max-workers=2 -I scripts/operator-network-init.gradle jar operatorProbeJar acceptanceJar ticketExperimentJar stageAcceptanceDependencies exportAcceptanceLaunches -PticketExperiment 2>&1 | tee build/operator-network/evidence/compile.log
          python3 scripts/repair_verify.py | tee build/operator-network/evidence/module-check.log
      - name: Disposable software display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Actual-client command parser receipts confirmation refusal and independent restart
        env:
          JAVA_TOOL_OPTIONS: '-Danya.nonblockingPrepare=true -Danya.minimalOwnership=true -Danya.serializationBudget=true -Danya.backpressure=true -Danya.pressureClient=true -Danya.repairJournal=true'
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1920x1200x24' python3 scripts/operator_network.py 2>&1 | tee build/operator-network/evidence/controller.log
      - name: Preserve exact source hashes and failed evidence
        if: always()
        run: |
          mkdir -p build/operator-network/evidence
          git rev-parse HEAD > build/operator-network/evidence/SOURCE_COMMIT.txt
          git archive --format=zip HEAD > build/operator-network/evidence/source.zip
          sha256sum build/libs/*.jar build/operator/*.jar build/acceptance/*.jar build/ticket-experiment/*.jar > build/operator-network/evidence/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-network-${{ github.sha }}
          path: build/operator-network/evidence/
          if-no-files-found: error
