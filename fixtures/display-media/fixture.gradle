gradle.beforeProject { project -> project.afterEvaluate {
    def playable = project.file(project.property('mediaPlayable'))
    def probe = project.sourceSets.create('displayProbe')
    probe.java.srcDir 'fixtures/display-media/java'
    probe.resources.srcDir 'fixtures/display-media/resources'
    project.neoForge.addModdingDependenciesTo(probe)
    project.dependencies.add(probe.compileOnlyConfigurationName, project.files(playable))
    def fixture = project.tasks.register('displayProbeJar', Jar) {
        dependsOn probe.classesTaskName
        from probe.output
        archiveBaseName = 'hosted-screen-playback-fixture'
        destinationDirectory = project.layout.buildDirectory.dir('display-media/tools')
    }
    def runtime = project.sourceSets.create('displayRuntime')
    project.neoForge.addModdingDependenciesTo(runtime)
    project.dependencies.add(runtime.runtimeOnlyConfigurationName, project.files(playable, fixture))
    def shared = project.hasProperty('roomMedia')
    def clients = shared ? ['RoomHost', 'RoomGuest', 'LateGuest'] : ['Client']
    (['Server'] + clients).each { side ->
        def dir = project.file("build/" + (shared ? "display-room/" : "display-media/") + side)
        project.neoForge.runs.create("display$side") {
            if (side == 'Server') { server(); programArgument '--nogui' }
            else {
                client()
                programArguments.addAll '--username', shared ? side : 'DisplayOwner', '--quickPlayMultiplayer', '127.0.0.1:25574', '--width', '960', '--height', '640'
            }
            sourceSet = runtime
            loadedMods = []
            gameDirectory = dir
            jvmArguments.addAll '-Xmx2g', '-Xms256m', '-XX:ActiveProcessorCount=2'
            systemProperty 'anyadisplay.frozen', playable.absolutePath
            if (shared) systemProperty 'anyadisplay.room', side
        }
        project.tasks.register("prepareDisplay$side") {
            dependsOn fixture, "createDisplay${side}LaunchScript"
            doLast {
                dir.mkdirs()
                new File(dir, 'launch.txt').text = project.tasks.named("createDisplay${side}LaunchScript").get().launchScript.get().asFile.absolutePath
            }
        }
    }
}}
